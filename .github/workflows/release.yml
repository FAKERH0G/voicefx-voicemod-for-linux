name: Build and publish RPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release to attach the RPM to
        required: true
        default: v0.7.0
        type: string

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM build and test dependencies
        run: |
          dnf install --assumeyes \
            gh \
            gstreamer1 \
            gstreamer1-plugins-bad-free \
            gstreamer1-plugins-good \
            gtk4 \
            libayatana-appindicator-gtk3 \
            pipewire-pulseaudio \
            portaudio \
            python3 \
            python3-devel \
            python3-gobject \
            python3-numpy \
            python3-sounddevice \
            rpm-build
      - name: Run tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests
      - name: Check tray indicator bindings
        run: PYTHONPATH=src python3 -c "import voicemod_for_linux.tray"
      - name: Build RPM
        run: ./scripts/build-rpm.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          rpm="$(find rpmbuild/RPMS -type f -name 'voicemod-for-linux-[0-9]*.rpm' -print -quit)"
          test -n "$rpm"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$rpm" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$rpm" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VoiceFX $RELEASE_TAG" \
              --generate-notes
          fi
