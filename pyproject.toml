[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicemod-for-linux"
version = "0.1.0"
description = "An unofficial, independent real-time voice-effects prototype for Fedora"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
test = []

[project.scripts]
voicemod-for-linux = "voicemod_for_linux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
